version: '3.8'

services:
  server:
    build: .
    container_name: gzacinema-server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '5000:5000'
    networks:
      - gzacinema-net

# Kết nối vào network chung với mysql & redis đã có sẵn
networks:
  gzacinema-net:
    external: true
